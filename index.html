<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบสอบออนไลน์ (Anti-Cheat System)</title>
    <!-- โหลด Tailwind CSS ผ่าน CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- 1. หน้าต่างกำลังโหลดข้อมูล -->
    <div id="view-loading" class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 text-center space-y-3">
        <div class="inline-block w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-2"></div>
        <h2 class="text-xl font-bold text-slate-800">กำลังโหลดข้อมูลระบบข้อสอบ...</h2>
        <p class="text-sm text-slate-500">กรุณารอสักครู่</p>
    </div>

    <!-- 2. หน้าต่างเข้าสู่ระบบ / เลือกวิชาสอบ -->
    <div id="view-login" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8 space-y-6 hidden">
        <div class="text-center">
            <h2 class="text-2xl font-bold text-slate-800">ยืนยันตัวตนเข้าสอบ</h2>
            <p class="text-sm text-slate-500 mt-1">กรุณาเลือกวิชาและกรอกอีเมลสถาบัน</p>
        </div>

        <form onsubmit="event.preventDefault(); handleVerifyEmail();" class="space-y-4">
            <div>
                <label for="select-exam" class="block text-sm font-medium text-slate-700 mb-1">เลือกวิชาสอบ</label>
                <select id="select-exam" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-base text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                    <option value="">-- กำลังโหลดรายชื่อวิชา... --</option>
                </select>
            </div>
        
            <div>
                <label for="input-email" class="block text-sm font-medium text-slate-700 mb-1">Email สถาบัน</label>
                <input type="email" id="input-email" placeholder="เช่น 28228@blm.ac.th" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-base text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all" required>
            </div>
        
            <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl text-base shadow-lg shadow-blue-500/30 transition-all duration-200">
                ตรวจสอบสิทธิ์และเข้าสอบ
            </button>
        </form>
    </div> <!-- ⭐ เติมแท็กปิด view-login ที่หายไปตรงนี้ -->

    <!-- 3. หน้าต่างแจ้งเตือนสอบไปแล้ว -->
    <div id="view-already-taken" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8 text-center space-y-4 hidden">
        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto text-red-600">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
        <h2 class="text-2xl font-bold text-red-600">ไม่สามารถเข้าสอบได้</h2>
        <p class="text-slate-600 text-sm">Email นี้ถูกใช้ในการทำข้อสอบไปแล้ว</p>
        <button onclick="switchView('view-login')" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl text-sm transition-all">
            กลับไปหน้ากรอก Email
        </button>
    </div>

    <!-- 4. หน้าต่างทำข้อสอบ (iFrame เต็มจอ) -->
    <div id="view-exam" class="fixed inset-0 w-full h-full bg-white z-50 hidden">
        <iframe id="exam-iframe" class="w-full h-full border-none">กำลังโหลดข้อสอบ...</iframe>
    </div>

    <!-- 5. หน้าต่างล็อกจอ (Lock Screen - Mobile Friendly UI) -->
    <div id="view-lock" class="fixed inset-0 w-full h-full bg-slate-900 z-[999] flex items-center justify-center p-4 overflow-y-auto hidden">
        <div class="w-full max-w-md bg-slate-800/90 backdrop-blur-md border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl text-center my-auto">
            
            <div class="w-16 h-16 bg-red-500/10 border border-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse">
                <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>

            <h2 class="text-xl sm:text-2xl font-bold text-white mb-2">ระบบถูกล็อกเนื่องจากทุจริต</h2>
            
            <p id="lock-message" class="text-sm sm:text-base text-slate-300 bg-slate-900/60 border border-slate-700/50 rounded-xl p-3.5 mb-6 leading-relaxed">
                คุณทุจริตการสอบเนื่องจากออกจากหน้าสอบเกินจำนวนที่กำหนด
            </p>

            <form onsubmit="event.preventDefault(); handleUnlock();" class="space-y-4">
                <div class="text-left">
                    <label for="teacher-password" class="block text-xs font-medium text-slate-400 mb-1.5 ml-1">
                        รหัสผ่านครูประจำวิชา / Admin
                    </label>
                    <input 
                        type="password" 
                        id="teacher-password" 
                        placeholder="กรอกรหัสผ่านเพื่อปลดล็อก" 
                        class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-base focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all"
                        autocomplete="off"
                    />
                </div>
            
                <button 
                    type="submit" 
                    class="w-full py-3.5 bg-red-600 hover:bg-red-500 active:bg-red-700 text-white font-medium rounded-xl text-base shadow-lg shadow-red-600/30 transition-all duration-200 active:scale-[0.98]"
                >
                    🔓 ยืนยันการปลดล็อก
                </button>
            </form>

            <p class="text-xs text-slate-500 mt-6">
                หากพบปัญหา กรุณายกมือแจ้งครูผู้สอนประจำห้องสอบ
            </p>
        </div>
    </div>

    <!-- โหลด JS หลัก -->
    <script src="script.js"></script>
</body>
</html>
